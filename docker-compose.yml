# Local PostgreSQL for development: `docker compose up -d db`
# Values come from the root .env (copy .env.example and fill it in).
# Keep the image tag in sync with server/src/test TestcontainersConfiguration.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-the_world_that_day}
      # Only the password is required (:?). Compose reports missing variables in
      # random order, so a second required variable would hide the password error.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set it in the root .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, which has these variables set.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
