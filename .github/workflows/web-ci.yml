name: web-ci

on:
  pull_request:
    paths:
      - 'web/**'
      # Web tests read the media examples (src/world/worldFixtures.test.ts).
      - 'data/schema/examples/media/valid/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      # Web tests read the media examples (src/world/worldFixtures.test.ts).
      - 'data/schema/examples/media/valid/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # E2E in Chromium only (D3 (a)); every request is intercepted, no server.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
