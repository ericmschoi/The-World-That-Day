# Test-only overrides. Spring Boot loads classpath:/config/application.yml after
# classpath:/application.yml, so these win in every @SpringBootTest context.
# Tests never call the real network (CLAUDE.md 7.5): every Wikimedia URL points at
# localhost, and Wikimedia is off unless a test turns it on. Tests that talk to WireMock
# extend WikimediaWireMockTest, which sets the real port and a User-Agent.
wikimedia:
  user-agent: ""
  kowiki-api-url: http://localhost:9/w/api.php
  wikidata-sparql-url: http://localhost:9/sparql
  commons-api-url: http://localhost:9/commons/w/api.php
# YouTube is off in tests whatever the root .env holds, and its address is local, so no test can
# reach Google (plan M3a5 T1). The Gradle test task removes YOUTUBE_API_KEY from the test JVM's
# environment. Limit: a run outside Gradle (for example from an IDE) can still pass the variable on,
# and it would override these test settings (relaxed binding); the API address stays local, so
# nothing reaches Google even then.
# Tests that talk to WireMock set their own key and address.
youtube:
  api-key: ""
  api-url: http://localhost:9/youtube/v3
# The empty key above makes YoutubeKeyCheck log its startup WARN in every test context. Tests that
# count WARN lines (for example "exactly one WARN for a failed Commons call") would also capture
# that line when they happen to start the shared context, so the order of test classes would
# decide the result. Only the test log level is lowered; the real app still logs the WARN, and
# YoutubeKeyCheckTest sets the level back to WARN itself.
logging:
  level:
    io.github.ericmschoi.theworldthatday.media.youtube.YoutubeKeyCheck: ERROR
