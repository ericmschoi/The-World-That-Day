spring:
  application:
    name: the-world-that-day
  config:
    # Root .env shared with docker-compose.yml. bootRun runs in server/, so ../ is
    # the repository root. Ignored when the file is missing (CI, tests).
    import: optional:file:../.env[.properties]
  # Defaults match docker-compose.yml. The password has no default on purpose.
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:the_world_that_day}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Milliseconds (Hikari binds a plain long; "1000ms" fails startup).
      # How long a caller waits for a pooled connection (Hikari default 30s). A day of Korean
      # Wikipedia events makes up to 2 database waits when the database is unreachable or the
      # pool is exhausted (one read per page; the write is skipped after a failed read) inside
      # wikimedia.kowiki-day-deadline (5s): 2 x 1s leaves the rest for the Wikipedia requests.
      # A warm pool hands out connections in microseconds and a new local connection takes tens
      # of milliseconds, so 1s is far above normal waits.
      connection-timeout: 1000
      # Hikari requires validation-timeout < connection-timeout (default 5s would let a hung
      # database hold a borrow past the connection timeout while the connection is checked).
      validation-timeout: 500
  jpa:
    # Schema changes go through Flyway only.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      # Actuator health is exposed as GET /api/health (contract with web/).
      base-path: /api
      exposure:
        include: health
      # GET /api must not list actuator links.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      # Boot 4 enables liveness/readiness groups by default, which adds a
      # "groups" field to the response. Keep the body to {"status":"UP"}.
      probes:
        enabled: false

# Shared settings for every Wikimedia call (plan M3a1). An empty user-agent turns all
# Wikimedia sources off: no request is sent and a WARN is logged once at startup.
wikimedia:
  user-agent: ${WIKIMEDIA_USER_AGENT:}
  connect-timeout: 2s
  read-timeout: 4s
  # GET only, on connect/read timeouts and 502/503/504. Other 4xx/5xx and 429 are not retried.
  max-retries: 1
  # Upper bound for a 429 Retry-After. The host gets no requests until the window ends.
  rate-limit-max-wait: 120s
  # Requests in flight at once, shared by every Wikimedia host (API etiquette: at most 3).
  # A request waits up to read-timeout for a free slot; otherwise nothing is sent.
  max-concurrent-requests: 3
  # How long a cached Wikipedia section (table wiki_section_cache) is used without asking again.
  # After that it is read again; if that fails, the old copy is used (state STALE).
  cache-ttl: 7d
  # Upper bound for one date of Korean Wikipedia events (plan M3a1c): both pages plus the link
  # lookup. A date page that timed out skips the year page request (its cached copy is still used).
  kowiki-day-deadline: 5s
  dedup:
    # Rule D3: two lines that share a specific main link are one event when their specific links
    # (not countries, cities or year/date pages) overlap at least this much: shared specific links
    # / specific links of the larger set. Above 0.5 so lines sharing only the tournament stay
    # apart. Lines that both link countries or cities, none in common, never merge by D3.
    min-link-overlap: 0.6
  kowiki-api-url: https://ko.wikipedia.org/w/api.php
  # Wikimedia Commons Action API (plan M3a3b): the day's photos, through the same client (User-Agent,
  # limits, request slots). Copied files are never stored: the API's addresses are shown as they are.
  commons-api-url: https://commons.wikimedia.org/w/api.php
  # Wikidata Query Service (plan M3a2): tone and scope signals of the events' main-link items
  # (CC0). One request per world API call. The call waits wikidata-read-timeout for the whole
  # lookup (each attempt included), then cancels it and waits at most 1s more (CANCEL_GRACE), so
  # one lookup takes up to wikidata-read-timeout + 1s. The address is a setting because the
  # service is moving to a new backend.
  wikidata-sparql-url: https://query.wikidata.org/sparql
  # The first attempt's read timeout is the whole 5s budget, so after a timeout no retry happens
  # (max-retries only helps when a 502/503/504 comes back quickly).
  wikidata-read-timeout: 5s
  # Instances of subclasses of these are tragic (rule:class): disaster, accident, terrorist attack,
  # armed conflict.
  wikidata-tragic-classes: Q3839081,Q171558,Q2223653,Q350604

# Shared media format (plan M3a3). Only these providers' image_embed / video_embed items are
# returned; anything else is dropped. Entries are lowercase provider IDs; a blank or malformed
# entry fails startup. Image embeds are out of M3; youtube is allowed for videos (plan M3a5).
media:
  allowed-image-embed-providers: []
  allowed-video-embed-providers: [youtube]
  # Day photos of the world section (plan M3a3b): at most day-media-limit photos of the day's
  # Commons category (0 turns the lookup off; none on a day with a tragic event). The whole media
  # lookup ends within lookup-deadline, then is cancelled with up to 1s of grace; a failure only
  # marks the answer partial. lookup-deadline is also the fixed read timeout of each media request,
  # which is sent once without a retry (plan M3a3c decision 1 (a)).
  day-media-limit: 6
  lookup-deadline: 3s
  # Event photos (plan M3a3d): the free lead image of a shown normal event's article, kept only when
  # its capture year is at most this many years from the requested year (unknown capture times are
  # kept and labelled). Looked up at once with the day photos, within the same lookup-deadline.
  max-years-apart: 5
  # Event videos (plan M3a4): at most one per event, for the first max-events shown normal events
  # with a main link (0 turns video search off). A candidate is kept only when it passes every
  # required rule and scores at least min-score; one longer than max-duration-seconds, or of unknown
  # length, is dropped. The three word lists are matched in titles and descriptions: a word with
  # Hangul ignoring every space ("카운트 다운" also hits "카운트다운"), any other word as a whole word
  # ignoring case ("relaunch" is not "launch"). Each list costs points once. A blank word fails
  # startup. Video sources share lookup-deadline with the photos; there is no separate timeout.
  # The Commons video source (plan M3a4b) uses commons-api-url and wikidata-sparql-url above: one
  # Wikidata query for the events' P10 files and categories with the day's "Videos taken on"
  # category (none on a tragic day), then the P10 files with one category search per event. Each
  # request is sent once with lookup-deadline as its read timeout; any failure leaves only the
  # Commons videos empty and marks the answer partial. Tragic events are never asked.
  video:
    min-score: 60
    max-events: 3
    max-duration-seconds: 600
    # Retrospective edits (−30). "restored" is left out on purpose: restored footage is the event.
    commemoration-words:
      - 재현
      - 기념
      - 기념식
      - 주년
      - 다시 보는
      - 추모
      - anniversary
      - reenactment
      - montage
      - highlights
      - comparison
      - memorial
      - commemoration
      - tribute
    # Another stage of the same event (−40), not counted when the word is in the event's own title
    # or text (a day whose event is the launch).
    other-stage-words:
      - 발사
      - launch
      - 리허설
      - rehearsal
      - 예행연습
      - 카운트다운
      - countdown
      - 훈련
      - training
      - 준비
      - preparation
    # Words left out of the event words of a main link title or English label (first list).
    # "on" is quoted: bare, YAML reads it as the boolean true.
    stopwords:
      - the
      - a
      - an
      - of
      - in
      - "on"
      - at
      - and
      - for
      - to
      - 및
  # Result cache of event video searches (plan M3a4c, table event_media_search_cache): how long a
  # source's result for an event of a date is used without asking again. Fresh while
  # fetched_at + ttl is after now. A result with no candidates is kept too; a failed, timed-out or
  # skipped search is not. Only addresses and text metadata are stored, never files. A source with
  # 0 or no entry is not cached; a negative value fails startup. youtube is kept at most 30 days
  # (YouTube's terms for API data), so a longer value fails startup too; 7d keeps it fresh. youtube
  # rows are deleted 29 days after they were fetched, checked at startup and every hour.
  search-cache:
    ttl:
      commons: 7d
      youtube: 7d
  # Items taken down at a rights holder's request (plan M3a3a, safeguard 5); applied on restart.
  # Each entry has a lowercase source and at least one of id, author or channel; an entry without
  # them, or without a source, fails startup. Matching: id exactly (Commons file name without
  # "File:", underscores and spaces alike; video or asset ID), author ignoring case (whole Commons
  # Artist text), channel exactly. A Commons id's first letter: lowercase also matches the capital.
  # Synthetic examples:
  #   blocklist:
  #     - source: commons
  #       id: Example photo.jpg
  #     - source: commons
  #       author: Example Author
  #     - source: youtube
  #       id: AAAAAAAAAAA
  #     - source: youtube
  #       channel: UCxxxxxxxxxxxxxxxxxxxxxx
  blocklist: []
  # Wire and news agencies never shown directly (safeguard 3). An image or video_file item whose
  # source_name, attribution, author or credit names one is dropped; provider embeds are not.
  # Latin entries match whole words ignoring case ("AP Photo" yes, "Japan" no; "AP통신" is not
  # caught, a known limitation), Hangul entries match anywhere. A blank entry fails startup.
  excluded-credits:
    - 연합뉴스
    - Yonhap
    - 뉴시스
    - Newsis
    - AP
    - Associated Press
    - Reuters
    - AFP
    - Getty
    - EPA

# YouTube Data API (plan M3a5): videos of the allowed official channels. The key stays in the
# environment (YOUTUBE_API_KEY, root .env) and is sent in a request header only. An empty key turns
# the YouTube source off: no request is sent and a WARN is logged once at startup.
youtube:
  api-key: ${YOUTUBE_API_KEY:}
  api-url: https://www.googleapis.com/youtube/v3
  # Only these channels are searched and shown, compared by channel ID. UC8_LPVE4Yuc6KF0opF6uS_w is
  # the KTV archive channel. Each entry is UC followed by 22 characters; at least one is needed.
  allowed-channels:
    - UC8_LPVE4Yuc6KF0opF6uS_w
  # Daily limits the app stays within, about 80% of the API's: 100 search calls (1 each) and 10,000
  # units for the other calls. The day changes at midnight Pacific time. 0 turns that part off.
  daily-search-budget: 80
  daily-unit-budget: 8000
  # Results asked per search (1 to 50).
  max-results: 25
  connect-timeout: 2s
  # A title matching one of these regular expressions is a retrospective edit ("1986년 9월 20일
  # 오늘 ..."): it is scored by its date text but gets no capture time.
  retrospective-title-patterns:
    - '\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*오늘'

app:
  # Curated data (data/ of the repository). bootRun and tests run in server/.
  data-dir: ../data
  # Where the web app is served from (scheme, host, optional port; no path). It is the origin
  # given to embedded video players. Change it when the web app runs elsewhere.
  web-origin: http://localhost:5173
