spring:
  application:
    name: the-world-that-day
  config:
    # Root .env shared with docker-compose.yml. bootRun runs in server/, so ../ is
    # the repository root. Ignored when the file is missing (CI, tests).
    import: optional:file:../.env[.properties]
  # Defaults match docker-compose.yml. The password has no default on purpose.
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:the_world_that_day}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Milliseconds (Hikari binds a plain long; "1000ms" fails startup).
      # How long a caller waits for a pooled connection (Hikari default 30s). A day of Korean
      # Wikipedia events makes up to 2 database waits when the database is unreachable or the
      # pool is exhausted (one read per page; the write is skipped after a failed read) inside
      # wikimedia.kowiki-day-deadline (5s): 2 x 1s leaves the rest for the Wikipedia requests.
      # A warm pool hands out connections in microseconds and a new local connection takes tens
      # of milliseconds, so 1s is far above normal waits.
      connection-timeout: 1000
      # Hikari requires validation-timeout < connection-timeout (default 5s would let a hung
      # database hold a borrow past the connection timeout while the connection is checked).
      validation-timeout: 500
  jpa:
    # Schema changes go through Flyway only.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      # Actuator health is exposed as GET /api/health (contract with web/).
      base-path: /api
      exposure:
        include: health
      # GET /api must not list actuator links.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      # Boot 4 enables liveness/readiness groups by default, which adds a
      # "groups" field to the response. Keep the body to {"status":"UP"}.
      probes:
        enabled: false

# Shared settings for every Wikimedia call (plan M3a1). An empty user-agent turns all
# Wikimedia sources off: no request is sent and a WARN is logged once at startup.
wikimedia:
  user-agent: ${WIKIMEDIA_USER_AGENT:}
  connect-timeout: 2s
  read-timeout: 4s
  # GET only, on connect/read timeouts and 502/503/504. Other 4xx/5xx and 429 are not retried.
  max-retries: 1
  # Upper bound for a 429 Retry-After. The host gets no requests until the window ends.
  rate-limit-max-wait: 120s
  # Requests in flight at once, shared by every Wikimedia host (API etiquette: at most 3).
  # A request waits up to read-timeout for a free slot; otherwise nothing is sent.
  max-concurrent-requests: 3
  # How long a cached Wikipedia section (table wiki_section_cache) is used without asking again.
  # After that it is read again; if that fails, the old copy is used (state STALE).
  cache-ttl: 7d
  # Upper bound for one date of Korean Wikipedia events (plan M3a1c): both pages plus the link
  # lookup. A date page that timed out skips the year page request (its cached copy is still used).
  kowiki-day-deadline: 5s
  dedup:
    # Rule D3: two lines that share a specific main link are one event when their specific links
    # (not countries, cities or year/date pages) overlap at least this much: shared specific links
    # / specific links of the larger set. Above 0.5 so lines sharing only the tournament stay
    # apart. Lines that both link countries or cities, none in common, never merge by D3.
    min-link-overlap: 0.6
  kowiki-api-url: https://ko.wikipedia.org/w/api.php
  # Wikidata Query Service (plan M3a2): tone and scope signals of the events' main-link items
  # (CC0). One request per world API call; each attempt and the whole lookup end within
  # wikidata-read-timeout. The address is a setting because the service is moving to a new backend.
  wikidata-sparql-url: https://query.wikidata.org/sparql
  # The first attempt's read timeout is the whole 5s budget, so after a timeout no retry happens
  # (max-retries only helps when a 502/503/504 comes back quickly).
  wikidata-read-timeout: 5s
  # Instances of subclasses of these are tragic (rule:class): disaster, accident, terrorist attack,
  # armed conflict.
  wikidata-tragic-classes: Q3839081,Q171558,Q2223653,Q350604

# Shared media format (plan M3a3). Only these providers' image_embed / video_embed items are
# returned; anything else is dropped. Entries are lowercase provider IDs; a blank or malformed
# entry fails startup. Image embeds are out of M3; M3a5 adds youtube for videos.
media:
  allowed-image-embed-providers: []
  allowed-video-embed-providers: []

app:
  # Curated data (data/ of the repository). bootRun and tests run in server/.
  data-dir: ../data
